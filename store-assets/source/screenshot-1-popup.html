<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>电台情歌设置界面</title>
  <link rel="stylesheet" href="showcase.css" />
</head>
<body>
  <main class="artboard">
    <header class="topbar">
      <div class="brand"><img src="../icon-128.png" alt="" />电台情歌</div>
      <div class="browser-pill">Chrome 浏览器扩展</div>
    </header>
    <section class="headline">
      <div class="eyebrow">你的私人音乐主持人</div>
      <h1>开关简单，声音由你选。</h1>
      <p>歌曲介绍、专辑故事和主持音色，都在一个轻巧的弹窗里完成。</p>
      <div class="chips">
        <span class="chip">无需 API Key</span>
        <span class="chip">普通话与方言</span>
        <span class="chip">自动降级</span>
      </div>
    </section>
    <section class="popup-shell" aria-label="电台情歌扩展弹窗">
      <div class="popup-header">
        <img src="../icon-128.png" alt="" />
        <div><div class="popup-title">电台情歌</div><div class="popup-subtitle">让每首歌都有一段开场</div></div>
      </div>
      <div class="setting-row"><div><div class="setting-label">播放前语音播报</div><div class="setting-status">已开启</div></div><span class="switch"></span></div>
      <div class="setting-row"><div><div class="setting-label">AI 生成介绍</div><div class="setting-status">AI 介绍</div></div><span class="switch"></span></div>
      <div class="setting-row"><div><div class="setting-label">专辑资料播报</div><div class="setting-status">新专辑首次出现时联网介绍</div></div><span class="switch"></span></div>
      <div class="voice"><div class="voice-label">音色</div><div class="select"><span>Maia · 知性温柔女声</span><span class="chevron"></span></div></div>
    </section>
    <div class="caption">界面展示基于 3.1.3 版本</div>
  </main>
</body>
</html>
