<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1280" />
  <title>电台情歌口播准备进度</title>
  <link rel="stylesheet" href="showcase.css" />
</head>
<body>
  <main class="artboard">
    <div class="music-window">
      <header class="music-nav">音乐网页版 · 正在播放</header>
      <section class="music-content">
        <div class="album-art"><div class="disc"></div></div>
        <div class="track-copy">
          <small>即将播放</small>
          <h2>下一首歌的故事</h2>
          <p>电台情歌正在准备中文口播，音乐会在播报后自动继续。</p>
          <div class="track-list"><div class="track-line"></div><div class="track-line"></div><div class="track-line"></div></div>
        </div>
      </section>
      <footer class="player">
        <div class="native-progress"></div>
        <div class="track-mini"><span class="mini-art"></span><div><strong>下一首歌的故事</strong><small>私人电台</small></div></div>
        <div class="controls"><span class="control-dot"></span><span class="control-dot play"></span><span class="control-dot"></span></div>
        <div></div>
      </footer>
    </div>
    <div class="caption">等待进度嵌入音乐网站原播放器，不额外遮挡页面</div>
  </main>
</body>
</html>
